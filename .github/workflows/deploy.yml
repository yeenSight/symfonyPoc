name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dump-database.yml'
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console doctrine:database:create --if-not-exists
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/phpunit

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Envoyer compose.prod.yaml
        run: scp compose.prod.yaml "$SSH_TARGET:/opt/app/compose.prod.yaml"

      - name: Écrire le .env sur le VPS
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          printf '%s\n' \
            "POSTGRES_DB=$POSTGRES_DB" \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "APP_SECRET=$APP_SECRET" \
            "APP_IMAGE=$IMAGE" \
          | ssh "$SSH_TARGET" 'umask 077 && cat > /opt/app/.env.new && mv /opt/app/.env.new /opt/app/.env'

      - name: Déployer et migrer la base
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$SSH_TARGET" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh "$SSH_TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/app
          DC="docker compose --env-file .env -f compose.prod.yaml"
          $DC pull app
          $DC up -d --remove-orphans
          # Attend que l'application réponde avant de migrer
          for i in $(seq 1 30); do
            $DC exec -T app php -v >/dev/null 2>&1 && break
            sleep 2
          done
          $DC exec -T app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          $DC exec -T app php bin/console doctrine:schema:validate --skip-sync
          docker logout ghcr.io
          docker image prune -f
          REMOTE
